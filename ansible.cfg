[defaults]
inventory = inventory/hosts.yml
host_key_checking = True
retry_files_enabled = False
vault_password_file = .vault_pass

# become is set per-task (dnf/firewalld/loginctl need root), NOT globally:
# the rootless Podman / systemd --user tasks must run as xzizka, not root.
[privilege_escalation]
become = False
become_method = sudo
