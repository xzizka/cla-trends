[defaults]
inventory = inventory/hosts.yml
host_key_checking = True
retry_files_enabled = False
vault_password_file = .vault_pass

# xzizka has no *usable* sudo on ubuntu-docker — it IS in the `sudo` group,
# but without NOPASSWD, so `sudo -n` fails and there is no password to give a
# playbook. This playbook therefore uses NO privilege escalation anywhere
# (unlike the fedora-podman/master version, which needed become for
# dnf/firewalld/loginctl). Docker + the `docker` group membership
# are assumed already set up by whoever provisioned the host — see
# roles/docker_base/tasks/main.yml for the preflight check and what to do if
# that assumption is wrong.
[privilege_escalation]
become = False
become_method = sudo
