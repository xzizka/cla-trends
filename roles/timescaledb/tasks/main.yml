---
- name: Pre-pull TimescaleDB image (can be slow on first run)
  community.docker.docker_image:
    name: "{{ timescaledb_image }}"
    source: pull

- name: Create init-scripts directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/timescaledb-init"
    state: directory
    # must stay world-readable+traversable: the postgres process inside the
    # container runs as the image's own uid (postgres, not xzizka's uid and
    # not xzizka's group), so 0750 makes it fail with "Permission denied"
    # just listing the bind-mounted directory.
    mode: "0755"

- name: Copy static schema / continuous-aggregate / policy SQL
  ansible.builtin.copy:
    src: "init/{{ item }}"
    dest: "/home/{{ ansible_user }}/timescaledb-init/{{ item }}"
    mode: "0644"
  loop:
    - "01-schema.sql"
    - "02-continuous-aggregates.sql"
    - "03-policies.sql"

- name: Render roles/grants SQL (contains vaulted passwords)
  ansible.builtin.template:
    src: "04-roles-grants.sql.j2"
    dest: "/home/{{ ansible_user }}/timescaledb-init/04-roles-grants.sql"
    # NOTE: must stay world-readable, same reason as the directory above —
    # 0600 makes docker-entrypoint-initdb.d fail to read it. These passwords
    # are no more exposed than POSTGRES_PASSWORD already is in `docker
    # inspect`/`ps aux` on this single-user host, so this is an accepted
    # tradeoff, not a real secret leak.
    mode: "0644"

- name: Deploy TimescaleDB container
  community.docker.docker_container:
    name: timescaledb
    image: "{{ timescaledb_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ docker_network_name }}"
    networks_cli_compatible: true
    # PG18+ docker-library images changed convention: they want a single
    # mount at /var/lib/postgresql and place data in a version-specific
    # subdirectory themselves (pg_ctlcluster-style), refusing to start if
    # pointed straight at .../data the pre-18 way. Revisit if downgrading
    # below pg18.
    # sql-init is NOT mounted at /docker-entrypoint-initdb.d on purpose:
    # CREATE EXTENSION timescaledb triggers an internal PostgreSQL restart,
    # which raced with the entrypoint's own automatic initdb.d run often
    # enough (bug-014/015 in buglog.json) to make that path unreliable.
    # Ansible applies this SQL explicitly and idempotently instead (below) —
    # this mount just makes the files available inside the container for that.
    volumes:
      - "{{ timescaledb_volume }}:/var/lib/postgresql"
      - "/home/{{ ansible_user }}/timescaledb-init:/opt/sql-init:ro"
    env:
      POSTGRES_DB: "{{ timescaledb_db }}"
      POSTGRES_USER: "{{ timescaledb_superuser }}"
      POSTGRES_PASSWORD: "{{ vault_timescaledb_superuser_password }}"
      TIMESCALEDB_TELEMETRY: "off"
    # loopback-only publish: convenient for `psql` from the host itself;
    # Grafana and the receiver reach this container over the internal
    # bridge network by name ("timescaledb"), never through this port.
    published_ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "{{ timescaledb_superuser }}", "-d", "{{ timescaledb_db }}"]
      interval: 15s
      retries: 5
      start_period: 30s
    # generous: the first pull of this image can take a long time on a slow link
    #
    # Boolean `false`, not the string 'never': both mean "don't pull, the
    # image is already local from the pre-pull task above" but the VM's
    # installed community.docker version still has `pull` as bool-only —
    # 'never' (str) blew up there with "unable to convert to bool". `false`
    # works on that version and on newer ones where `pull` accepts either.
    pull: false
  notify: Restart timescaledb

- name: Flush handlers so the container is (re)started before we wait on it
  ansible.builtin.meta: flush_handlers

- name: Wait for TimescaleDB to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 5432
    timeout: 120

# Not driven by docker-entrypoint-initdb.d (see the NOT-mounted-there note
# above) — applied explicitly here, every deploy, against whatever's
# actually running. All four files are idempotent (IF NOT EXISTS /
# if_not_exists => true), so repeating this is safe.
#
# CREATE EXTENSION timescaledb (in 01-schema.sql) makes PostgreSQL restart
# itself once to load the library via shared_preload_libraries, which drops
# this psql connection mid-file the first time it ever runs. retries/delay
# ride out that restart instead of treating it as a failure.
- name: Apply/reapply schema, continuous aggregates, policies, roles+grants
  ansible.builtin.command:
    cmd: >-
      docker exec -i timescaledb
      psql -U {{ timescaledb_superuser }} -d {{ timescaledb_db }}
      -v ON_ERROR_STOP=1 -f /opt/sql-init/{{ item }}
  register: timescaledb_reapply_result
  until: timescaledb_reapply_result.rc == 0
  retries: 6
  delay: 5
  loop:
    - "01-schema.sql"
    - "02-continuous-aggregates.sql"
    - "03-policies.sql"
    - "04-roles-grants.sql"
  changed_when: false
