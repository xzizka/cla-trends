---
# Explicit restart (same reasoning as timescaledb's handler): after a
# rebuild, the image tag string is unchanged ("receiver:1.0.0"), so we force
# the recreate rather than assume docker_container's own diffing catches it.
- name: Restart receiver
  community.docker.docker_container:
    name: receiver
    image: "{{ receiver_image_name }}:{{ receiver_image_tag }}"
    state: started
    restart: true
    restart_policy: unless-stopped
    networks:
      - name: "{{ docker_network_name }}"
    networks_cli_compatible: true
    env:
      RECEIVER_PORT: "{{ receiver_port | string }}"
      RECEIVER_BEARER_TOKEN: "{{ vault_receiver_bearer_token }}"
      RECEIVER_PG_DSN: "postgresql://{{ timescaledb_receiver_user }}:{{ vault_timescaledb_receiver_password }}@timescaledb:5432/{{ timescaledb_db }}"
    published_ports:
      - "0.0.0.0:{{ receiver_port }}:{{ receiver_port }}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ receiver_port }}/healthz', timeout=3)"]
      interval: 15s
      retries: 5
      start_period: 15s
    # false, not 'never': the VM's community.docker has `pull` as bool-only
    # (see roles/timescaledb/tasks/main.yml) and the image is already local
    # by the time a handler runs.
    pull: false
