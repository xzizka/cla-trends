---
- name: Create receiver app directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/receiver-app"
    state: directory
    mode: "0755"

- name: Copy receiver app source
  ansible.builtin.copy:
    src: "app/{{ item }}"
    dest: "/home/{{ ansible_user }}/receiver-app/{{ item }}"
    mode: "0644"
  loop:
    - "receiver.py"
    - "requirements.txt"
    - "Containerfile"
  register: receiver_app_files

- name: Build receiver container image
  community.docker.docker_image:
    name: "{{ receiver_image_name }}"
    tag: "{{ receiver_image_tag }}"
    source: build
    build:
      path: "/home/{{ ansible_user }}/receiver-app"
      dockerfile: Containerfile
    force_source: "{{ receiver_app_files.changed }}"
  notify: Restart receiver

- name: Deploy receiver container
  community.docker.docker_container:
    name: receiver
    image: "{{ receiver_image_name }}:{{ receiver_image_tag }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ docker_network_name }}"
    networks_cli_compatible: true
    env:
      RECEIVER_PORT: "{{ receiver_port | string }}"
      RECEIVER_BEARER_TOKEN: "{{ vault_receiver_bearer_token }}"
      RECEIVER_PG_DSN: "postgresql://{{ timescaledb_receiver_user }}:{{ vault_timescaledb_receiver_password }}@timescaledb:5432/{{ timescaledb_db }}"
    published_ports:
      - "0.0.0.0:{{ receiver_port }}:{{ receiver_port }}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ receiver_port }}/healthz', timeout=3)"]
      interval: 15s
      retries: 5
      start_period: 15s
    pull: never
  notify: Restart receiver
