---
- name: Pre-pull Grafana image (can be slow on first run)
  community.docker.docker_image:
    name: "{{ grafana_image }}"
    source: pull

- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/grafana-provisioning/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - datasources
    - dashboards-provider
    - dashboards-json

- name: Render TimescaleDB datasource provisioning file
  ansible.builtin.template:
    src: "timescaledb.yml.j2"
    dest: "/home/{{ ansible_user }}/grafana-provisioning/datasources/timescaledb.yml"
    # must stay world-readable: the Grafana process inside the container
    # runs as the image's own uid (472), not xzizka's uid/group — see
    # bug-008/009 in buglog.json.
    mode: "0644"
  notify: Restart grafana

- name: Deploy dashboard provider config
  ansible.builtin.copy:
    src: "provisioning/dashboards-provider/dashboards.yml"
    dest: "/home/{{ ansible_user }}/grafana-provisioning/dashboards-provider/dashboards.yml"
    mode: "0644"
  notify: Restart grafana

- name: Deploy provisioned dashboards
  ansible.builtin.copy:
    src: "provisioning/dashboards-json/"
    dest: "/home/{{ ansible_user }}/grafana-provisioning/dashboards-json/"
    mode: "0644"
  notify: Restart grafana

- name: Deploy Grafana container
  community.docker.docker_container:
    name: grafana
    image: "{{ grafana_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ docker_network_name }}"
    networks_cli_compatible: true
    volumes:
      - "{{ grafana_volume }}:/var/lib/grafana"
      - "/home/{{ ansible_user }}/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro"
      - "/home/{{ ansible_user }}/grafana-provisioning/dashboards-provider:/etc/grafana/provisioning/dashboards:ro"
      - "/home/{{ ansible_user }}/grafana-provisioning/dashboards-json:/var/lib/grafana/dashboards:ro"
    env:
      GF_SECURITY_ADMIN_USER: "{{ grafana_admin_user }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ vault_grafana_admin_password }}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    published_ports:
      - "0.0.0.0:{{ grafana_port }}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health"]
      interval: 15s
      retries: 5
      start_period: 30s
    # false, not 'never': the VM's community.docker has `pull` as bool-only
    # (see roles/timescaledb/tasks/main.yml) and the image is already local
    # from the pre-pull task above.
    pull: false
  notify: Restart grafana
