---
- name: Install podman
  ansible.builtin.dnf:
    name:
      - podman
    state: present
  become: true

- name: Enable lingering so user systemd services survive logout
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user }}"
  become: true
  changed_when: true

- name: Open firewalld port for Grafana (LAN)
  ansible.posix.firewalld:
    port: "{{ grafana_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  become: true

- name: Open firewalld port for the metrics remote_write receiver (LAN)
  ansible.posix.firewalld:
    port: "{{ receiver_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  become: true

- name: Create Quadlet directory
  ansible.builtin.file:
    path: "{{ podman_quadlet_dir }}"
    state: directory
    mode: "0755"

- name: Deploy shared pod network Quadlet unit
  ansible.builtin.template:
    src: network.network.j2
    dest: "{{ podman_quadlet_dir }}/{{ podman_network_name }}.network"
    mode: "0644"
  notify: Reload systemd user (podman_base)

- name: Deploy named volume Quadlet units
  ansible.builtin.template:
    src: volume.volume.j2
    dest: "{{ podman_quadlet_dir }}/{{ item }}.volume"
    mode: "0644"
  loop:
    - "{{ timescaledb_volume }}"
    - "{{ grafana_volume }}"
  notify: Reload systemd user (podman_base)

- name: Flush handlers so the network/volume units exist before other roles use them
  ansible.builtin.meta: flush_handlers
