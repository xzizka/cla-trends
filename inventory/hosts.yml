all:
  hosts:
    ubuntu-docker:
      # Run FROM ubuntu-docker itself (control node == target), same as
      # fedora-podman on master. If you ever run it from elsewhere, switch
      # back to an SSH connection (ansible_host + ansible_user, drop
      # ansible_connection).
      #
      # xzizka has NO sudo on this host — see roles/docker_base/tasks/main.yml
      # for what that does and doesn't let this playbook do.
      ansible_connection: local
      ansible_user: xzizka
      ansible_python_interpreter: /usr/bin/python3
