all:
  hosts:
    ubuntu-docker:
      # Reached over SSH from the control node (unlike fedora-podman on
      # master, which ran the playbook locally on itself because rootless
      # Podman's systemd --user units needed the invoking user's own login
      # session). Docker has no such requirement, so a normal SSH connection
      # works here.
      #
      # xzizka has NO sudo on this host — see roles/docker_base/tasks/main.yml
      # for what that does and doesn't let this playbook do.
      ansible_host: 192.168.122.115
      ansible_user: xzizka
      ansible_python_interpreter: /usr/bin/python3
