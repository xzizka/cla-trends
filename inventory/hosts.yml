all:
  hosts:
    fedora-podman:
      # This playbook is run FROM fedora-podman itself (control node == target),
      # since the local dev machine's Ansible is too old for this project.
      # If you ever run it from elsewhere, switch back to an SSH connection
      # (ansible_host + ansible_user, drop ansible_connection/ansible_user_uid).
      ansible_connection: local
      ansible_user: xzizka
      ansible_python_interpreter: /usr/bin/python3
